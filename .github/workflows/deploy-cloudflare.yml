name: deploy-cloudflare

# MANUAL ONLY. Nothing deploys on push. A person starts this from the Actions tab, types "deploy" to confirm, and picks what to deploy.
# It needs two repository SECRETS that Sai creates (never in the repo): CLOUDFLARE_API_TOKEN (permissions: Workers Scripts Edit, Cloudflare Pages Edit)
# and CLOUDFLARE_ACCOUNT_ID. The TMDB token is NOT set here: set it once with `wrangler secret put TMDB_READ_ACCESS_TOKEN` (docs/CLOUDFLARE.md).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to confirm'
        required: true
      what:
        description: 'What to deploy'
        type: choice
        options: [worker, pages, both]
        default: both
      pages_branch:
        description: 'Pages branch name: the project production branch (usually main) = production site; anything else = a preview URL'
        default: preview
      api_base_url:
        description: 'Public Worker address for the site to call (https://...workers.dev). Empty = browser-only mode'
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Deploy Worker
        if: ${{ inputs.what == 'worker' || inputs.what == 'both' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Build and deploy Pages
        if: ${{ inputs.what == 'pages' || inputs.what == 'both' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MMDE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          node scripts/pages-build.mjs
          npx --yes wrangler@4 pages deploy dist/pages --project-name=mmde --branch="${{ inputs.pages_branch }}"
