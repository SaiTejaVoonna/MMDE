name: publish-pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-web.mjs'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Publish web to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PUBLIC setting (not a secret): backend URL, e.g. https://mmde-production.up.railway.app
          # Set it under repo Settings > Secrets and variables > Actions > Variables. Empty = same-origin.
          MMDE_API_BASE_URL: ${{ vars.MMDE_API_BASE_URL }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          mkdir -p /tmp/mmde-pages
          cp -R web/. /tmp/mmde-pages/
          # Inject the backend URL into the PUBLISHED copy of config.js only (the repo keeps the same-origin default).
          if [ -n "$MMDE_API_BASE_URL" ]; then
            case "$MMDE_API_BASE_URL" in
              https://*) ;;
              *) echo "MMDE_API_BASE_URL must start with https://"; exit 1 ;;
            esac
            node -e 'const u=process.env.MMDE_API_BASE_URL.trim().replace(/\/+$/,"");require("fs").writeFileSync("/tmp/mmde-pages/config.js","// Generated by publish-pages from the MMDE_API_BASE_URL repository variable (public value).\nwindow.MMDE_CONFIG = "+JSON.stringify({apiBaseUrl:u})+";\n")'
            echo "config.js -> $(cat /tmp/mmde-pages/config.js | tail -1)"
          else
            echo "MMDE_API_BASE_URL not set: published config.js keeps apiBaseUrl \"\" (same-origin)"
          fi
          # build-web rewrites a tracked bundle in the main worktree; discard that
          # generated diff before switching to the deployment branch.
          git reset --hard HEAD
          git checkout gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -R /tmp/mmde-pages/. .
          touch .nojekyll
          git add -A
          git diff --cached --quiet || git commit -m "deploy: update MMDE web"
          git push origin gh-pages
