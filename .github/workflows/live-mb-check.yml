name: live-mb-check
on:
  push:
    branches: [live-mb-check]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apple iTunes Search probe (which store / term finds the OG albums?)
        run: |
          for c in us in jp; do
            for term in "They Call Him OG" "They Call Him OG soundtrack" "OG Thaman"; do
              echo "== country=$c term=[$term]"
              curl -s -m 20 -A "MMDE/0.3 (probe)" -G "https://itunes.apple.com/search" --data-urlencode "term=$term" --data-urlencode "entity=album" --data-urlencode "limit=10" --data-urlencode "country=$c" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.resultCount+" results:",(j.results||[]).slice(0,8).map(r=>r.collectionName+" ["+r.trackCount+"]").join(" | "))}catch(e){console.log("not json:",s.slice(0,120))}})'
              sleep 3
            done
          done
