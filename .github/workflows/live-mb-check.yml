name: live-mb-check
on:
  push:
    branches: [live-mb-check]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Start the Worker under workerd
        run: |
          WRANGLER_SEND_METRICS=false nohup npx --yes wrangler@4 dev --local --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8788/api/health && break || sleep 2; done
      - name: Golden titles
        run: BASE_URL=http://127.0.0.1:8788 node scripts/golden.mjs --titles=1 --json=/tmp/golden.json
