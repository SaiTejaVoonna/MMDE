name: live-mb-check
on:
  push:
    branches: [live-mb-check]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Start the Worker under the real Workers runtime (workerd) with a simulated KV cache
        run: |
          sed 's/^# \[\[kv_namespaces\]\]/[[kv_namespaces]]/; s/^# binding = "CACHE"/binding = "CACHE"/; s/^# id = .*/id = "local-test-cache"/' wrangler.toml > /tmp/wrangler.ci.toml
          cp /tmp/wrangler.ci.toml ./wrangler.ci.toml
          WRANGLER_SEND_METRICS=false nohup npx --yes wrangler@4 dev -c wrangler.ci.toml --local --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8788/api/health && break || sleep 2; done
          echo
      - name: Cache behaviour inside workerd (miss, then hit)
        run: |
          for i in 1 2; do curl -s -D - -o /dev/null "http://127.0.0.1:8788/api/albums?title=Fire%20Force&year=2019" | grep -iE "^(HTTP|x-mmde-cache|cache-control)"; sleep 1; done
          echo "-- bad origin:"; curl -s -o /dev/null -w '%{http_code}\n' -H 'Origin: https://evil.example' "http://127.0.0.1:8788/api/search?q=x"
      - name: Golden titles against the Worker (real services, no TMDB token)
        run: BASE_URL=http://127.0.0.1:8788 node scripts/golden.mjs --json=/tmp/golden.json
      - name: Worker log (errors only)
        if: always()
        run: grep -iE "error|exception|exceeded" /tmp/wrangler.log | head -30 || true
