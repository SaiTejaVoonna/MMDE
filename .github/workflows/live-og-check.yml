name: live-og-check
on:
  push:
    branches: [live-og-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/live-og.mjs
